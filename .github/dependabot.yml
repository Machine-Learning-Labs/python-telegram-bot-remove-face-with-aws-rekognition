# Generado automáticamente: una PR por dependencia (sin agrupar).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "terraform"
    directory: "/iac"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
